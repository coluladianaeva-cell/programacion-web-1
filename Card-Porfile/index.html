<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de perfil Diana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <article class="profile-card">
      
        <figure class="profile-header">
            ><img class="profile-photo" src="./diana perfil.jpeg" alt="Fotografia de Diana Colula">
            <figcaption class="profile-details">
                <h2>Diana Colula</h2>
                <p>Creador de contenido</p> 
            </figcaption>
        </figure>

        <section class="profile-skills">
            <h3>Habilidades</h3>
            <ul class="skill-list">
                <li>Desarrollo web</li>
                <li>Diseño editorial</li>
                <li>Mercadotecnia</li>
            </ul>
        </section>

        <div class="profile-contact">
            <a class="contact-button" href="#">Enviar mensaje</a>
            <div class="social-media">
                <image src="./instagram.svg" alt="Icono instagram"></image>
                <image src="./tiktok.svg" alt="Icono tiktok"></image>
                <image src="./twitter.svg" alt="Icono threads"></image>
            </div>
        </div>

        <span class="status-badge">
            Disponible
        </span>

    </article>
    
</body>
</html>
