<!-- 
 
Listas 

Las listas nos ayudan a estructurar informacion de forma ordenada y no ordenadad

ordenada

Llevan una numeracion y se usa la siguiente sintaxis:

<ol>>...</ol>

No Ordenada 

Esta lista tiene bullets o viñetas. Su sintaxis es:

<ul>...</ul>

Para los elementos de lista se usa la sintaxis:

<li>...</li>

El atributo de "type" permite cambiar el tipo de numeracion y bullet de la lista.

sintaxis:

type="..."

-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
 <h1>Listas</h1> 
 <p> Tenemos listas ordenadas y no ordenadas</p>  

 <h2>Mi comida favorita</h2>
 <ol type="a">
    <li>Pizza🍕</li>
    <li>Sushi🍥</li>
    <li>Chiles en nogada🍷</li>
 </ol>
 
<h2>comida</h2>

<ul type="bullets">
    <li>Papas a la francesa🍟</li>
    <li>sushi🍥</li>
    <li>leon🦁</li>
</ul>
</body>
</html>
