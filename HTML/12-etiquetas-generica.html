<!-- 
 
Etiquetas genricas

existen dos etiquetas genericas que nos ayudan a crear elementos de tipo bloque y linea.

div: se usa como una division y semanticamente no significa nada. Pero sirve como un contenedor de bloque.

span: Es un contenedor de linea, se suele usra para encerrar palabras o pequeños textos. semanticamnete no significa nada.

Contenedor de bloque

- Van a ocupar todo el ancho disponible y daran un salto de linea.

Conetnedores de linea 

- Van a ocupar el ancho de su contenido y no dan salto de linea. 

-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas genericas</title>
</head>
<body>
    <h1>Etiquetas genericas</h1>
    <div>
        Esto es un <span style="color:red">elemento de bloque</span> 
    </div>

    <div>
        Este es otro elemento de bloque. <span style="color:red">Y yo soy un elemento de linea</span> 
    </div>
</body>
</html>
