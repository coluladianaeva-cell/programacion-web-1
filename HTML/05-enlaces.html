<!-- 
 
Enlaces 

Los enlaces nos permiten crear navegacion interna o externa en html.

Sintaxis Basica 

<a> ... </a> 

Los enlaces requieren del atributo "href" para funcionar como elementos interactivos 

Sintaxis con href:

<a href="..."> ... </a>

El atributo href puede recibir los siguientes valores:

* Una url extrena 
*el path de un archivo html
*un id de elemento

El atributo "target" nos permite indicarle al enlace que se debe abrir en una pestaña nueva cuando le indicamos el valor "_blank"

Sintaxis con target:

<a href="..." target="..."> ... </a>)

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
<h1>Enlaces</h1>   
<p>Los enlaces puedem ser internos y externos.</p> 
<a href="https://es.wikipedia.org/wiki/CD9" target="_blank">Soy un enlace hacia biografia de CD9!</a>
<br/> 
<a href="./04-etiquetas-de-texto.html">Este es un enlace hacia un archivo html</a>
<br/>

</body>
</html>
