<!-- 
 
iframes

sirven para incrustar contenido externos como videos de youtube, mapas, documentos, interfaces

- src: direcion del contenido
- width: ancho
- height: alto
- allowfullscreen: permite la pantalla completa 

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>
<body>
 <h1>iframes</h1> 
 
 <h2>video de youtube</h2>

 <iframe width="560" height="315" src="https://www.youtube.com/embed/8rw4xknrm4g?si=-LgTh_c64odDoRJQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

 <h2>google maps</h2>

 <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d942.843029563812!2d-98.21145134610849!3d19.047369919550636!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfc6d4531e0fff%3A0xaf32047582fa31ba!2sAS%20Media%20Centro%20de%20Formaci%C3%B3n%20Profesional%20A.C.!5e0!3m2!1ses-419!2smx!4v1758825789659!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
