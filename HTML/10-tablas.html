<!-- 
 
tablas

Estructura de filas y columnas para el acomo, clasificacion y estructura de datos

<table>...</table>  Elemento tabla general
<tr>...</tr>  table row, fila de tabla
<td>...</td> table data, celda de dato
<th>...</th>  table headline/celda de encabezado
<thead>...</thead>  Seccion de cabecera de la table
<tbody>...</tbody>  seccion de cuerpo de la tabla 
<tfoot>...</tfoot> seccion de pie de la tabla 

-->
