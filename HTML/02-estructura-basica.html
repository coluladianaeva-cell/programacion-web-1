<!--

Estructura basica 

<!DOCTYPE html> Declara el tipo de documento y la version de HTML que se esta utilizando. 

 <html lang="es"> Elemento raiz que contiene todo el contenido del documento. El atributo "lang"especifica el idioma del contenido

 <head> Contien matadatos sobre el documento, como el conjuto de caracteres, la vista para los dispositivos moviles y datos del documento. 

    <meta charset="UTF-8"/> Define la codificacion de caracteres utilizada en el documento. 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/> Configura la vista para que sea responsiva en dispositivos moviles. 

    <title> Esta etiqueta define el titulo de la pagina que aparece en la pestaña del navegador. 

    <body> Contiene el contenido visible de la pagina web, como encabezados, parrafos, imagenes, formularios, secciones, etc, etc, etc....

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de HTML</title>
</head>
<body>
    
</body>
</html>
