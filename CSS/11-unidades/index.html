<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unidades</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <h1>Unidades</h1>

    <section>
        <h2>Unidades absolutas</h2>
        <div class="box px">Pixeles</div>
        <div class="box cm">Centimetros</div>
        <div class="box in">Pulgadas</div>
    </section>
    
    <article>
        <h2>Unidades realtivas</h2>
        <div class="box em">EM</div>
        <div class="box rem">REM</div>
        <div class="box percent">Porcentaje</div>
        <div class="box vw">Ancho Viewport</div>
        <div class="box vh">Alto Viewport</div>
        <div class="box vmin">Viewport Minimo</div>
        <div class="box vmax">Viewport Maximo</div>
    </article>
</body>
</html>
